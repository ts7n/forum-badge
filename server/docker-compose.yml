services:
  forum-badge:
    build: .
    image: forum-badge-server
    container_name: forum-badge
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8787
    ports:
      - "${HOST_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
